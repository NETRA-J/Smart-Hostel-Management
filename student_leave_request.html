<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leave Request</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="app-body page-student">

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">Smart Hostel - Leave Request</span>
        <a href="{{ url_for('student.dashboard') }}" class="btn btn-outline-light btn-sm">Back</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-lg">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4">Submit Leave Request</h4>

                    {% if error %}
                        <div class="alert alert-danger text-center">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">Reason</label>
                            <textarea name="reason"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Write your leave reason"
                                      minlength="5"
                                      maxlength="500"
                                      required>{{ reason }}</textarea>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">From Date</label>
                                <input type="date" name="from_date" id="from_date" class="form-control" value="{{ from_date }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">To Date</label>
                                <input type="date" name="to_date" id="to_date" class="form-control" value="{{ to_date }}" required>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Submit Request</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const fromDate = document.getElementById("from_date");
    const toDate = document.getElementById("to_date");
    const today = new Date().toISOString().split("T")[0];

    fromDate.min = today;
    toDate.min = fromDate.value || today;

    fromDate.addEventListener("change", () => {
        toDate.min = fromDate.value || today;
        if (toDate.value && toDate.value < toDate.min) {
            toDate.value = "";
        }
    });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
