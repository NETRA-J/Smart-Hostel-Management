<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Room</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    function updateCapacity() {
        const roomType = document.getElementById("roomType").value;
        const capacityInput = document.getElementById("capacity");

        capacityInput.value = "";
        capacityInput.disabled = false;
        capacityInput.min = 1;
        capacityInput.max = 10;

        if (roomType === "Single") {
            capacityInput.value = 1;
            capacityInput.readOnly = true;
        }
        else if (roomType === "Double") {
            capacityInput.value = 2;
            capacityInput.readOnly = true;
        }
        else if (roomType === "Dormitory") {
            capacityInput.readOnly = false;
            capacityInput.min = 3;
            capacityInput.max = 10;
        }
    }

    function validateAddRoom() {
        const roomType = document.getElementById("roomType").value;
        const capacity = Number(document.getElementById("capacity").value);
        const roomNumber = document.getElementById("room_number").value.trim();
        const fee = Number(document.getElementById("monthly_fee").value);
        const roomPattern = /^[A-Za-z0-9-]{1,20}$/;

        if (!roomPattern.test(roomNumber)) {
            alert("Room number should be 1-20 chars (letters, numbers, hyphen)");
            return false;
        }
        if (!roomType) {
            alert("Please select room type");
            return false;
        }
        if (!Number.isInteger(capacity) || capacity <= 0) {
            alert("Capacity must be a positive number");
            return false;
        }
        if (roomType === "Single" && capacity !== 1) {
            alert("Single room capacity must be 1");
            return false;
        }
        if (roomType === "Double" && capacity !== 2) {
            alert("Double room capacity must be 2");
            return false;
        }
        if (roomType === "Dormitory" && (capacity < 3 || capacity > 10)) {
            alert("Dormitory capacity must be between 3 and 10");
            return false;
        }
        if (!Number.isInteger(fee) || fee <= 0) {
            alert("Monthly fee must be a positive number");
            return false;
        }

        document.getElementById("room_number").value = roomNumber;
        return true;
    }
    </script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>


<body class="app-body page-admin">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">
            🏨 Smart Hostel — Add Room
        </span>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-light btn-sm">
            Back
        </a>
    </div>
</nav>

<!-- FORM -->
<div class="container mt-5" style="max-width:500px;">

    <h4 class="mb-4 text-center">Add New Room</h4>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" onsubmit="return validateAddRoom()">

        <!-- ROOM NUMBER -->
        <div class="mb-3">
            <label class="form-label">Room Number</label>
            <input type="text"
                   id="room_number"
                   name="room_number"
                   class="form-control"
                   placeholder="Enter room number"
                   maxlength="20"
                   pattern="[A-Za-z0-9-]{1,20}"
                   required>
        </div>

        <!-- ROOM TYPE -->
        <div class="mb-3">
            <label class="form-label">Room Type</label>
            <select name="room_type"
                    id="roomType"
                    class="form-control"
                    required
                    onchange="updateCapacity()">
                <option value="">Select room type</option>
                <option value="Single">Single</option>
                <option value="Double">Double</option>
                <option value="Dormitory">Dormitory</option>
            </select>
        </div>

        <!-- CAPACITY -->
        <div class="mb-3">
            <label class="form-label">Capacity</label>
            <input type="number"
                name="capacity"
                id="capacity"
                class="form-control"
                placeholder="Select room type first"
                min="1"
                max="10"
                readonly
                required>
        </div>


        <!-- MONTHLY FEE -->
        <div class="mb-4">
            <label class="form-label">Monthly Fee (₹)</label>
            <input type="number"
                   id="monthly_fee"
                   name="monthly_fee"
                   class="form-control"
                   placeholder="Enter monthly fee"
                   min="1"
                   step="1"
                   required>
        </div>

        <!-- SUBMIT -->
        <div class="d-grid">
            <button class="btn btn-primary">
                Add Room
            </button>
        </div>

    </form>

</div>

</body>
</html>
