<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">


</head>

<body class="app-body page-auth">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">
            🏨 Smart Hostel -- Student Login
        </span>
    </div>
</nav>

<!-- LOGIN CARD -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <div class="card shadow-lg">
                <div class="card-body p-4">

                    <h4 class="text-center mb-4">Student Login</h4>

                    {% if error %}
                        <div class="alert alert-danger text-center">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST" onsubmit="return validateStudentLogin()">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text"
                                   name="username"
                                   id="username"
                                   class="form-control"
                                   placeholder="Enter student username"
                                   minlength="3"
                                   maxlength="20"
                                   pattern="[A-Za-z0-9_.]{3,20}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password"
                                   name="password"
                                   id="password"
                                   class="form-control"
                                   placeholder="Enter password"
                                   minlength="4"
                                   maxlength="64"
                                   required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-success btn-lg">
                                Login
                            </button>
                        </div>

                    </form> 
                    <div class="text-center">
                        New Student?
                        <a href="{{ url_for('auth.student_signup') }}" class="text-decoration-none">
                            Sign Up
                        </a>
                    </div>

                    <div class="text-center mt-2">
                        <a href="{{ url_for('index') }}" class="text-decoration-none">
                            ← Back to Home
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
function validateStudentLogin() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value;
    const usernamePattern = /^[A-Za-z0-9_.]{3,20}$/;

    if (!usernamePattern.test(user)) {
        alert("Username must be 3-20 characters and contain only letters, numbers, _ or .");
        return false;
    }

    if (pass.length < 4 || pass.length > 64) {
        alert("Password length must be between 4 and 64 characters");
        return false;
    }

    if (/\s/.test(pass)) {
        alert("Password cannot contain spaces");
        return false;
    }

    document.getElementById("username").value = user;
    return true;
}
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
