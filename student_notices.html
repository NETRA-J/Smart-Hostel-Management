<!DOCTYPE html>
<html>
<head>
    <title>Notice Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</head>

<body class="app-body page-student">

<div class="container mt-4">
    <h4 class="mb-4">Hostel Notices</h4>

    {% for n in notices %}
        <div class="card mb-3">
            <div class="card-body">
                <h5>{{ n['title'] }}</h5>
                <p>{{ n['message'] }}</p>
                <small class="text-muted">{{ n['created_at'] }}</small>
            </div>
        </div>
    {% endfor %}

    <a href="{{ url_for('student.dashboard') }}" class="btn btn-link">Back</a>
</div>

</body>
</html>
