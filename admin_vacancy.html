<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room Vacancy Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</head>

<body class="app-body page-admin">

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">Smart Hostel — Vacancy Report</span>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-light btn-sm">Back</a>
    </div>
</nav>

<div class="container mt-4">
    <h4 class="mb-3">Room Vacancy Report</h4>

    <table class="table table-bordered table-striped text-center align-middle">
        <thead class="table-dark">
            <tr>
                <th>Room</th>
                <th>Capacity</th>
                <th>Occupied</th>
                <th>Available</th>
            </tr>
        </thead>
        <tbody>
            {% for r in rooms %}
            <tr>
                <td>{{ r['room_number'] }}</td>
                <td>{{ r['capacity'] }}</td>
                <td>{{ r['occupied'] }}</td>
                <td>{{ r['available'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
