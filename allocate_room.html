<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Allocate Room</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">


</head>

<body class="app-body page-admin">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">
            🏨 Smart Hostel -- Allocate Room
        </span>

        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-light btn-sm">
            Back
        </a>
    </div>
</nav>

<!-- FORM CARD -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg">
                <div class="card-body p-4">

                    <h4 class="text-center mb-4">Allocate Room to Student</h4>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} text-center">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    {% if error %}
                        <div class="alert alert-danger text-center">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST" onsubmit="return confirmAllocation()">

                        <!-- STUDENT SELECT -->
                        <div class="mb-3">
                            <label class="form-label">Select Student</label>
                            <select name="student" class="form-select" required>
                                <option value="">-- Choose Student --</option>
                                {% for s in students %}
                                    <option value="{{ s['username'] }}">
                                        {{ s['username'] }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- ROOM SELECT -->
                        <div class="mb-4">
                            <label class="form-label">Select Room</label>
                            <select name="room" class="form-select" required>
                                <option value="">-- Choose Room --</option>
                                {% for r in rooms %}
                                    <option value="{{ r['room_number'] }}">
                                        {{ r['room_number'] }}
                                        ({{ r['occupied'] }}/{{ r['capacity'] }} occupied)
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- SUBMIT -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                Allocate Room
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
function confirmAllocation() {
    return confirm("Are you sure you want to allocate this room?");
}
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
